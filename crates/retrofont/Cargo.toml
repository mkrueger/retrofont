[package]
name = "retrofont"
version = "0.2.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Retro terminal font toolkit: TDF/FIGlet parsing, rendering, conversion."
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["tdf", "figlet", "convert"]
tdf = []
figlet = []
convert = ["tdf", "figlet"]
color = []
serde = ["dep:serde"]
# Rendering helpers used by tests and downstream test suites.
test-support = []

[dependencies]
thiserror = "2.0.20"
zip = "8.6.0"
once_cell = "1.21.4"
serde = { version = "1.0.229", features = ["derive"], optional = true }

[dev-dependencies]
retrofont = { path = ".", features = ["test-support"] }
pretty_assertions = "1.4.1"
criterion = "0.8.2"

[[bench]]
name = "tdf_loading"
harness = false
path = "../../benches/tdf_loading.rs"
