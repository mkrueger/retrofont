[package]
name = "retrofont"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Retro terminal font toolkit: TDF/FIGlet/TOIlet parsing, rendering, conversion."
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["tdf", "figlet", "convert", "native"]
# Pure Rust ZIP decompression (no C libraries, no OS RNG); suitable for wasm32.
# Use with `default-features = false`.
pure-rust = [
    "zip/deflate-flate2-zlib-rs",
    "zip/deflate64",
    "zip/bzip2",
    "zip/lzma",
    "zip/xz",
    "zip/ppmd",
]
# Full ZIP codec set, including C-backed zstd and AES decryption.
native = ["pure-rust", "zip/default"]
tdf = []
figlet = []
convert = ["tdf", "figlet"]
color = []
serde = ["dep:serde"]
# Rendering helpers used by tests and downstream test suites.
test-support = []

[dependencies]
thiserror = "2.0.20"
zip = { version = "8.6.0", default-features = false }
once_cell = "1.21.4"
serde = { version = "1.0.229", features = ["derive"], optional = true }

[dev-dependencies]
retrofont = { path = ".", features = ["test-support"] }
pretty_assertions = "1.4.1"
criterion = "0.8.2"

[[bench]]
name = "tdf_loading"
harness = false
path = "../../benches/tdf_loading.rs"
